<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET PG College Cutoff Finder</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header Section -->
    <header class="bg-indigo-700 text-white py-8 px-4 shadow-md mb-8">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">NEET PG Counseling Cutoff Finder</h1>
            <p class="mt-2 text-indigo-100 text-sm sm:text-base">Quickly search and filter opening & closing ranks across colleges, courses, and categories.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-16">
        
        <!-- Search & Filter Controls -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            
            <!-- Main Search Bar -->
            <div class="mb-6">
                <label for="searchInput" class="block text-sm font-medium text-slate-700 mb-1">Search College or Specialty</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Type college name, city, or course (e.g., MAMC, Radiology, General Medicine)..." 
                           class="w-full pl-4 pr-10 py-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-900">
                </div>
            </div>

            <!-- Multi-Layered Dropdown Filters -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- Quota / State Filter -->
                <div>
                    <label for="quotaFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Quota / State</label>
                    <select id="quotaFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <option value="">All Quotas</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div>
                    <label for="categoryFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category</label>
                    <select id="categoryFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <!-- Course / Specialty Filter -->
                <div>
                    <label for="courseFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Course / Specialty</label>
                    <select id="courseFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <option value="">All Courses</option>
                    </select>
                </div>

                <!-- Round Filter -->
                <div>
                    <label for="roundFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Round</label>
                    <select id="roundFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <option value="">All Rounds</option>
                        <option value="Round 1">Round 1</option>
                        <option value="Round 2">Round 2</option>
                        <option value="Mop-Up">Mop-Up Round</option>
                        <option value="Stray">Stray Vacancy</option>
                    </select>
                </div>

            </div>

            <!-- Clear Filters Button & Counter -->
            <div class="mt-6 flex flex-wrap items-center justify-between gap-4 border-t pt-4 border-slate-100">
                <span id="resultsCount" class="text-sm font-medium text-slate-600">Loading counseling data...</span>
                <button id="resetBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-semibold underline cursor-pointer">
                    Reset All Filters
                </button>
            </div>

        </div>

        <!-- Dynamic Results Table -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="py-4 px-4 sm:px-6">College / Institute</th>
                            <th class="py-4 px-4 sm:px-6">Course</th>
                            <th class="py-4 px-4 sm:px-6">Quota</th>
                            <th class="py-4 px-4 sm:px-6">Category</th>
                            <th class="py-4 px-4 sm:px-6 text-emerald-400 font-bold">Opening Rank</th>
                            <th class="py-4 px-4 sm:px-6 text-rose-400 font-bold">Closing Rank</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm text-slate-700">
                        <tr>
                            <td colspan="6" class="py-8 text-center text-slate-500">Loading data, please wait...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let allData = [];

        // DOM Element references
        const searchInput = document.getElementById('searchInput');
        const quotaFilter = document.getElementById('quotaFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const courseFilter = document.getElementById('courseFilter');
        const roundFilter = document.getElementById('roundFilter');
        const tableBody = document.getElementById('tableBody');
        const resultsCount = document.getElementById('resultsCount');
        const resetBtn = document.getElementById('resetBtn');

        // Fetch JSON generated from Google Colab
        fetch('neet_pg_cutoffs.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load neet_pg_cutoffs.json file.');
                }
                return response.json();
            })
            .then(data => {
                allData = data;
                populateDropdownOptions(allData);
                filterAndRender();
            })
            .catch(error => {
                console.error('Error loading JSON data:', error);
                tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500 font-semibold">Error loading neet_pg_cutoffs.json file. Make sure it is uploaded in the same folder as index.html.</td></tr>`;
                resultsCount.innerText = 'Data failed to load';
            });

        // Automatically populate category, quota, and course dropdowns with unique options
        function populateDropdownOptions(data) {
            const categories = new Set();
            const quotas = new Set();
            const courses = new Set();

            data.forEach(item => {
                if (item.Allotted_Category) categories.add(item.Allotted_Category);
                if (item.Allotted_Quota) quotas.add(item.Allotted_Quota);
                if (item.Course) courses.add(item.Course);
            });

            // Fill Categories
            Array.from(categories).sort().forEach(cat => {
                categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
            });

            // Fill Quotas
            Array.from(quotas).sort().forEach(q => {
                quotaFilter.innerHTML += `<option value="${q}">${q}</option>`;
            });

            // Fill Courses
            Array.from(courses).sort().forEach(c => {
                courseFilter.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        // Filtering Logic
        function filterAndRender() {
            const searchText = searchInput.value.toLowerCase().trim();
            const selectedQuota = quotaFilter.value;
            const selectedCategory = categoryFilter.value;
            const selectedCourse = courseFilter.value;
            const selectedRound = roundFilter.value;

            const filtered = allData.filter(item => {
                const matchesSearch = !searchText || 
                    (item.Allotted_Institute && item.Allotted_Institute.toLowerCase().includes(searchText)) ||
                    (item.Course && item.Course.toLowerCase().includes(searchText));

                const matchesQuota = !selectedQuota || item.Allotted_Quota === selectedQuota;
                const matchesCategory = !selectedCategory || item.Allotted_Category === selectedCategory;
                const matchesCourse = !selectedCourse || item.Course === selectedCourse;
                const matchesRound = !selectedRound || (item.Round && item.Round === selectedRound);

                return matchesSearch && matchesQuota && matchesCategory && matchesCourse && matchesRound;
            });

            renderTable(filtered);
        }

        // Render rows into HTML Table (Limited to top 200 for fast page performance)
        function renderTable(data) {
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500">No matching college cutoffs found. Try adjusting your filters.</td></tr>`;
                resultsCount.innerText = 'Found 0 results';
                return;
            }

            const displayLimit = 200;
            const subset = data.slice(0, displayLimit);

            let rowsHTML = '';
            subset.forEach(item => {
                rowsHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-3 px-4 sm:px-6 font-medium text-slate-900">${item.Allotted_Institute || 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6">${item.Course || 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6"><span class="inline-block px-2 py-0.5 text-xs bg-slate-100 text-slate-700 rounded border border-slate-200">${item.Allotted_Quota || 'All India'}</span></td>
                        <td class="py-3 px-4 sm:px-6"><span class="inline-block px-2 py-0.5 text-xs bg-indigo-50 text-indigo-700 font-medium rounded border border-indigo-100">${item.Allotted_Category || 'N/A'}</span></td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-emerald-600">${item.Opening_Rank ? item.Opening_Rank.toLocaleString() : 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-rose-600">${item.Closing_Rank ? item.Closing_Rank.toLocaleString() : 'N/A'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = rowsHTML;

            if (data.length > displayLimit) {
                resultsCount.innerText = `Showing first ${displayLimit} of ${data.length.toLocaleString()} matching cutoffs (Refine search for specific results)`;
            } else {
                resultsCount.innerText = `Showing all ${data.length.toLocaleString()} matching cutoffs`;
            }
        }

        // Attach Event Listeners
        searchInput.addEventListener('input', filterAndRender);
        quotaFilter.addEventListener('change', filterAndRender);
        categoryFilter.addEventListener('change', filterAndRender);
        courseFilter.addEventListener('change', filterAndRender);
        roundFilter.addEventListener('change', filterAndRender);

        // Reset Filters
        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            quotaFilter.value = '';
            categoryFilter.value = '';
            courseFilter.value = '';
            roundFilter.value = '';
            filterAndRender();
        });
    </script>
</body>
</html>
