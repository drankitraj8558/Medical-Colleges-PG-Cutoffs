<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical PG Counseling Cutoff Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-800 text-white py-8 px-4 shadow-lg mb-8">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Medical PG Cutoff Portal</h1>
            <p class="mt-2 text-indigo-100 text-sm sm:text-base">NEET PG & INI-CET College Cutoff Finder across rounds and categories.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-16">
        
        <!-- Search & Filter Controls -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            
            <!-- Search Bar -->
            <div class="mb-6">
                <label for="searchInput" class="block text-sm font-medium text-slate-700 mb-1">Search College, City, or Specialty</label>
                <input type="text" id="searchInput" placeholder="Type college name (e.g., MAMC, AIIMS Delhi, General Medicine, Radiology)..." 
                       class="w-full pl-4 pr-10 py-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900">
            </div>

            <!-- Dynamic Dropdowns Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                
                <!-- Exam Filter -->
                <div>
                    <label for="examFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Exam</label>
                    <select id="examFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Exams</option>
                    </select>
                </div>

                <!-- Year Filter -->
                <div>
                    <label for="yearFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Year</label>
                    <select id="yearFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Years</option>
                    </select>
                </div>

                <!-- Round Filter -->
                <div>
                    <label for="roundFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Round</label>
                    <select id="roundFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Rounds</option>
                    </select>
                </div>

                <!-- Quota Filter -->
                <div>
                    <label for="quotaFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Quota</label>
                    <select id="quotaFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Quotas</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div>
                    <label for="categoryFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category</label>
                    <select id="categoryFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <!-- Course Filter -->
                <div>
                    <label for="courseFilter" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Course</label>
                    <select id="courseFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">All Courses</option>
                    </select>
                </div>

            </div>

            <!-- Footer Controls -->
            <div class="mt-6 flex flex-wrap items-center justify-between gap-4 border-t pt-4 border-slate-100">
                <span id="resultsCount" class="text-sm font-medium text-slate-600">Loading counseling data...</span>
                <button id="resetBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-semibold underline cursor-pointer">
                    Reset All Filters
                </button>
            </div>

        </div>

        <!-- Dynamic Results Table -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="py-4 px-4 sm:px-6">Exam & Year</th>
                            <th class="py-4 px-4 sm:px-6">Round</th>
                            <th class="py-4 px-4 sm:px-6">College / Institute</th>
                            <th class="py-4 px-4 sm:px-6">Course</th>
                            <th class="py-4 px-4 sm:px-6">Category</th>
                            <th class="py-4 px-4 sm:px-6 text-emerald-400 font-bold">Opening Rank</th>
                            <th class="py-4 px-4 sm:px-6 text-rose-400 font-bold">Closing Rank</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm text-slate-700">
                        <tr>
                            <td colspan="7" class="py-8 text-center text-slate-500">Loading dataset, please wait...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let allData = [];

        // DOM References
        const searchInput = document.getElementById('searchInput');
        const examFilter = document.getElementById('examFilter');
        const yearFilter = document.getElementById('yearFilter');
        const roundFilter = document.getElementById('roundFilter');
        const quotaFilter = document.getElementById('quotaFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const courseFilter = document.getElementById('courseFilter');
        const tableBody = document.getElementById('tableBody');
        const resultsCount = document.getElementById('resultsCount');
        const resetBtn = document.getElementById('resetBtn');

        // Fetch JSON File
        fetch('neet_pg_cutoffs.json')
            .then(res => res.json())
            .then(data => {
                allData = data;
                populateDynamicDropdowns(allData);
                filterAndRender();
            })
            .catch(err => {
                console.error('Error loading JSON:', err);
                tableBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500 font-semibold">Error loading data. Check if neet_pg_cutoffs.json is uploaded in the root folder.</td></tr>`;
            });

        // Automatically populate all dropdown options dynamically from the JSON
        function populateDynamicDropdowns(data) {
            const exams = new Set();
            const years = new Set();
            const rounds = new Set();
            const quotas = new Set();
            const categories = new Set();
            const courses = new Set();

            data.forEach(item => {
                if (item.Exam) exams.add(item.Exam);
                if (item.Year) years.add(item.Year);
                if (item.Round) rounds.add(item.Round);
                if (item.Allotted_Quota) quotas.add(item.Allotted_Quota);
                if (item.Allotted_Category) categories.add(item.Allotted_Category);
                if (item.Course) courses.add(item.Course);
            });

            // Helper function to fill a dropdown
            const fillSelect = (selectElem, setValues) => {
                Array.from(setValues).sort().forEach(val => {
                    selectElem.innerHTML += `<option value="${val}">${val}</option>`;
                });
            };

            fillSelect(examFilter, exams);
            fillSelect(yearFilter, years);
            fillSelect(roundFilter, rounds);
            fillSelect(quotaFilter, quotas);
            fillSelect(categoryFilter, categories);
            fillSelect(courseFilter, courses);
        }

        // Filtering Function
        function filterAndRender() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const selectedExam = examFilter.value;
            const selectedYear = yearFilter.value;
            const selectedRound = roundFilter.value;
            const selectedQuota = quotaFilter.value;
            const selectedCategory = categoryFilter.value;
            const selectedCourse = courseFilter.value;

            const filtered = allData.filter(item => {
                const matchesSearch = !searchVal || 
                    (item.Allotted_Institute && item.Allotted_Institute.toLowerCase().includes(searchVal)) ||
                    (item.Course && item.Course.toLowerCase().includes(searchVal));

                const matchesExam = !selectedExam || String(item.Exam) === selectedExam;
                const matchesYear = !selectedYear || String(item.Year) === selectedYear;
                const matchesRound = !selectedRound || item.Round === selectedRound;
                const matchesQuota = !selectedQuota || item.Allotted_Quota === selectedQuota;
                const matchesCategory = !selectedCategory || item.Allotted_Category === selectedCategory;
                const matchesCourse = !selectedCourse || item.Course === selectedCourse;

                return matchesSearch && matchesExam && matchesYear && matchesRound && matchesQuota && matchesCategory && matchesCourse;
            });

            renderTable(filtered);
        }

        // Table Renderer
        function renderTable(data) {
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">No matching cutoffs found. Try adjusting your filters.</td></tr>`;
                resultsCount.innerText = 'Found 0 results';
                return;
            }

            const limit = 200;
            const subset = data.slice(0, limit);

            let rows = '';
            subset.forEach(item => {
                rows += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-3 px-4 sm:px-6">
                            <span class="font-bold text-slate-800">${item.Exam || 'NEET PG'}</span>
                            <span class="block text-xs text-slate-500">${item.Year || '2025'}</span>
                        </td>
                        <td class="py-3 px-4 sm:px-6 text-xs font-semibold text-slate-600">${item.Round || 'Round 1'}</td>
                        <td class="py-3 px-4 sm:px-6 font-medium text-slate-900">${item.Allotted_Institute || 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6">${item.Course || 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6"><span class="inline-block px-2 py-0.5 text-xs bg-indigo-50 text-indigo-700 font-medium rounded border border-indigo-100">${item.Allotted_Category || 'N/A'}</span></td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-emerald-600">${item.Opening_Rank ? item.Opening_Rank.toLocaleString() : 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-rose-600">${item.Closing_Rank ? item.Closing_Rank.toLocaleString() : 'N/A'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = rows;
            resultsCount.innerText = data.length > limit 
                ? `Showing first ${limit} of ${data.length.toLocaleString()} results` 
                : `Showing all ${data.length.toLocaleString()} results`;
        }

        // Listeners
        [searchInput, examFilter, yearFilter, roundFilter, quotaFilter, categoryFilter, courseFilter].forEach(elem => {
            elem.addEventListener('input', filterAndRender);
            elem.addEventListener('change', filterAndRender);
        });

        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            examFilter.value = '';
            yearFilter.value = '';
            roundFilter.value = '';
            quotaFilter.value = '';
            categoryFilter.value = '';
            courseFilter.value = '';
            filterAndRender();
        });
    </script>
</body>
</html>
