<script>
        // ============================================================
        // 🔐 CONFIGURATION KEYS
        // ============================================================
        const SUPABASE_URL = 'https://udwlruggphsrauusyauc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4EGYOh9BxQm3F9z2UvTw7A_DDy2GnhR';
        const RAZORPAY_KEY_ID = 'rzp_test_TNvIPuOMlItT28';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.userHasPaid = false;

        // Check Session & Payment Status
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-btn').style.display = 'none';
                const emailSpan = document.getElementById('user-email');
                emailSpan.style.display = 'inline';
                emailSpan.innerText = session.user.email;
                document.getElementById('logout-btn').style.display = 'inline';
                
                await checkPaymentStatus(session.user.id);
            }
        }

        // Listen for Auth State Changes (Handles Auto-Login on Magic Link Redirect)
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                checkUserSession();
                closeLoginModal();
            }
        });

        async function checkPaymentStatus(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('is_paid')
                .eq('id', userId)
                .single();

            if (data && data.is_paid) {
                window.userHasPaid = true;
                filterAndRender();
            }
        }

        async function handleEmailLogin() {
            const email = document.getElementById('auth-email-input').value.trim();
            const msg = document.getElementById('auth-message');
            if (!email) {
                msg.innerText = "Please enter a valid email address.";
                return;
            }
            
            const { error } = await supabase.auth.signInWithOtp({ 
                email: email,
                options: {
                    emailRedirectTo: window.location.href
                }
            });

            if (error) {
                msg.innerText = "Error: " + error.message;
            } else {
                msg.innerText = "📧 Magic Link sent! Check your email inbox to log in.";
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            location.reload();
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('flex');
        }

        document.getElementById('loginModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('loginModal')) closeLoginModal();
        });

        // --- Razorpay Payment Trigger ---
        async function triggerRazorpayPayment() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                alert("Please log in first so we can activate full access for your account!");
                openLoginModal();
                return;
            }

            const userEmail = session.user.email;
            const userId = session.user.id;

            const options = {
                "key": RAZORPAY_KEY_ID,
                "amount": 1000, // 1000 paise = ₹10
                "currency": "INR",
                "name": "Medical PG Cutoff Portal",
                "description": "1-Year Full Access (Buy Me a Chai ☕)",
                "prefill": {
                    "email": userEmail
                },
                "theme": {
                    "color": "#4f46e5"
                },
                "handler": async function (response) {
                    if (response.razorpay_payment_id) {
                        const { error } = await supabase
                            .from('profiles')
                            .update({ is_paid: true })
                            .eq('id', userId);

                        if (error) {
                            alert("Payment succeeded, but updating account failed. Payment ID: " + response.razorpay_payment_id);
                        } else {
                            alert("🎉 Payment Successful! Full portal access unlocked for 1 year.");
                            window.userHasPaid = true;
                            filterAndRender();
                        }
                    }
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        checkUserSession();

        // ============================================================
        // 📁 DATASET & FILTERING LOGIC
        // ============================================================
        const jsonFiles = [
            'NEETPG_2024_ROUND1.json',
            'NEETPG_2024_ROUND2.json',
            'NEETPG_2025_ROUND1.json',
            'NEETPG_2025_ROUND2.json',
            'NEETPG_2025_ROUND3.json',
            'INICET_2026_JULY_ROUND1.json'
        ];

        let allData = [];
        let allCoursesList = [];
        let selectedCourseValue = "";

        const rankInput = document.getElementById('rankInput');
        const searchInput = document.getElementById('searchInput');
        const examFilter = document.getElementById('examFilter');
        const yearFilter = document.getElementById('yearFilter');
        const roundFilter = document.getElementById('roundFilter');
        const quotaFilter = document.getElementById('quotaFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const courseInput = document.getElementById('courseInput');
        const courseWrapper = document.getElementById('courseWrapper');
        const courseDropdown = document.getElementById('courseDropdown');
        const tableBody = document.getElementById('tableBody');
        const resultsCount = document.getElementById('resultsCount');
        const resetBtn = document.getElementById('resetBtn');

        Promise.all(
            jsonFiles.map(file => 
                fetch(`./${file}`)
                    .then(res => res.ok ? res.json() : [])
                    .catch(() => [])
            )
        )
        .then(datasets => {
            allData = datasets.flat();
            if (allData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-red-500 font-semibold">No data loaded. Check if JSON filenames match your uploaded files.</td></tr>`;
                return;
            }
            populateDynamicDropdowns(allData);
            filterAndRender();
        });

        function populateDynamicDropdowns(data) {
            const exams = new Set(), years = new Set(), rounds = new Set(), quotas = new Set(), categories = new Set(), courses = new Set();

            data.forEach(item => {
                if (item.Exam) exams.add(String(item.Exam));
                if (item.Year) years.add(String(item.Year));
                if (item.Round) rounds.add(String(item.Round));
                if (item.Allotted_Quota) quotas.add(String(item.Allotted_Quota));
                if (item.Allotted_Category) categories.add(String(item.Allotted_Category));
                if (item.Course) courses.add(String(item.Course));
            });

            const fillSelect = (selectElem, setValues) => {
                const defaultOption = selectElem.options[0].outerHTML;
                selectElem.innerHTML = defaultOption;
                Array.from(setValues).sort().forEach(val => {
                    selectElem.innerHTML += `<option value="${val}">${val}</option>`;
                });
            };

            fillSelect(examFilter, exams);
            fillSelect(yearFilter, years);
            fillSelect(roundFilter, rounds);
            fillSelect(quotaFilter, quotas);
            fillSelect(categoryFilter, categories);
            allCoursesList = Array.from(courses).sort();
        }

        // Searchable Course Combobox Logic
        function renderCourseDropdown(filterText = "") {
            const query = filterText.toLowerCase().trim();
            const matches = allCoursesList.filter(c => c.toLowerCase().includes(query));
            let html = `<div class="p-2.5 text-xs font-bold text-indigo-700 bg-indigo-50/50 hover:bg-indigo-100 cursor-pointer border-b flex justify-between items-center" onclick="selectCourse('')"><span>All Courses (Clear Filter)</span><span class="text-[10px] text-slate-400">RESET</span></div>`;

            if (matches.length === 0) {
                html += `<div class="p-3 text-xs text-slate-400 text-center">No matching courses found</div>`;
            } else {
                matches.forEach(course => {
                    const safeCourse = course.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `<div class="p-2.5 text-xs text-slate-700 hover:bg-indigo-50 hover:text-indigo-900 cursor-pointer transition-colors" onclick="selectCourse('${safeCourse}')">${course}</div>`;
                });
            }
            courseDropdown.innerHTML = html;
            courseDropdown.classList.remove('hidden');
        }

        window.selectCourse = function(courseName) {
            selectedCourseValue = courseName;
            courseInput.value = courseName ? courseName : "";
            courseDropdown.classList.add('hidden');
            filterAndRender();
        };

        courseInput.addEventListener('focus', () => renderCourseDropdown(courseInput.value));
        courseWrapper.addEventListener('click', () => {
            if (courseDropdown.classList.contains('hidden')) renderCourseDropdown(courseInput.value);
        });
        courseInput.addEventListener('input', () => {
            selectedCourseValue = courseInput.value;
            renderCourseDropdown(courseInput.value);
            filterAndRender();
        });
        document.addEventListener('click', (e) => {
            if (!courseWrapper.contains(e.target) && !courseDropdown.contains(e.target)) courseDropdown.classList.add('hidden');
        });

        // Filter & Render Table
        function filterAndRender() {
            const userRank = parseInt(rankInput.value);
            const searchVal = searchInput.value.toLowerCase().trim();
            const selectedExam = examFilter.value;
            const selectedYear = yearFilter.value;
            const selectedRound = roundFilter.value;
            const selectedQuota = quotaFilter.value;
            const selectedCategory = categoryFilter.value;
            const selectedCourse = selectedCourseValue.toLowerCase().trim();

            const filtered = allData.filter(item => {
                const matchesRank = isNaN(userRank) || (item.Closing_Rank && userRank <= item.Closing_Rank);
                const matchesSearch = !searchVal || 
                    (item.Allotted_Institute && item.Allotted_Institute.toLowerCase().includes(searchVal)) ||
                    (item.Course && item.Course.toLowerCase().includes(searchVal));

                const matchesExam = !selectedExam || String(item.Exam) === selectedExam;
                const matchesYear = !selectedYear || String(item.Year) === selectedYear;
                const matchesRound = !selectedRound || String(item.Round) === selectedRound;
                const matchesQuota = !selectedQuota || String(item.Allotted_Quota) === selectedQuota;
                const matchesCategory = !selectedCategory || String(item.Allotted_Category) === selectedCategory;
                const matchesCourse = !selectedCourse || (item.Course && item.Course.toLowerCase().includes(selectedCourse));

                return matchesRank && matchesSearch && matchesExam && matchesYear && matchesRound && matchesQuota && matchesCategory && matchesCourse;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const userRank = parseInt(rankInput.value);
            const totalMatches = data.length;

            if (totalMatches === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-slate-500">No matching cutoffs found for your rank and filters. Try adjusting your search.</td></tr>`;
                resultsCount.innerText = 'Found 0 results';
                return;
            }

            // DYNAMIC PERCENTAGE PREVIEW: ~15% preview (min 3, max 25 rows)
            let freePreviewCount = Math.ceil(totalMatches * 0.15);
            if (freePreviewCount < 3) freePreviewCount = 3;
            if (freePreviewCount > 25) freePreviewCount = 25;

            const displayLimit = 200;
            let displayData = data;
            let isPaywalled = false;

            if (!window.userHasPaid && totalMatches > freePreviewCount) {
                displayData = data.slice(0, freePreviewCount);
                isPaywalled = true;
            } else {
                displayData = data.slice(0, displayLimit);
            }

            let rows = '';
            displayData.forEach(item => {
                const isExactFit = !isNaN(userRank) && 
                                   item.Opening_Rank && item.Closing_Rank && 
                                   userRank >= item.Opening_Rank && userRank <= item.Closing_Rank;

                const rowBgClass = isExactFit 
                    ? 'bg-emerald-50/90 border-l-4 border-emerald-500 hover:bg-emerald-100/90' 
                    : 'hover:bg-slate-50';

                const matchBadge = isExactFit 
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-600 text-white shadow-sm ml-2">🎯 Allotment Range Match</span>` 
                    : '';

                rows += `
                    <tr class="${rowBgClass} transition-colors">
                        <td class="py-3 px-4 sm:px-6">
                            <span class="font-bold text-slate-800">${item.Exam || 'NEET PG'}</span>
                            <span class="block text-xs text-slate-500">${item.Year || 'N/A'}</span>
                        </td>
                        <td class="py-3 px-4 sm:px-6 text-xs font-semibold text-slate-600">${item.Round || 'Round 1'}</td>
                        <td class="py-3 px-4 sm:px-6 font-medium text-slate-900">
                            ${item.Allotted_Institute || 'N/A'}
                            ${matchBadge}
                        </td>
                        <td class="py-3 px-4 sm:px-6 font-medium">${item.Course || 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6 space-y-1">
                            <div><span class="inline-block px-2 py-0.5 text-xs bg-slate-100 text-slate-700 rounded border border-slate-200">${item.Allotted_Quota || 'All India'}</span></div>
                            <div><span class="inline-block px-2 py-0.5 text-xs bg-indigo-50 text-indigo-700 font-medium rounded border border-indigo-100">${item.Allotted_Category || 'N/A'}</span></div>
                        </td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-emerald-600">${item.Opening_Rank ? item.Opening_Rank.toLocaleString() : 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-rose-600">${item.Closing_Rank ? item.Closing_Rank.toLocaleString() : 'N/A'}</td>
                        <td class="py-3 px-4 sm:px-6 font-bold text-indigo-700">${item.Total_Seats !== undefined ? item.Total_Seats.toLocaleString() : 'N/A'}</td>
                    </tr>
                `;
            });

            // Friendly Chai Paywall Banner
            if (isPaywalled) {
                const hiddenCount = totalMatches - freePreviewCount;
                rows += `
                    <tr>
                        <td colspan="8" class="py-10 text-center bg-slate-900/5 backdrop-blur-sm border-t-2 border-indigo-200">
                            <div class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-xl border border-indigo-100 space-y-3">
                                <div class="text-3xl">☕</div>
                                <h4 class="text-slate-900 font-extrabold text-lg">Buy me a Chai to unlock all remaining ${hiddenCount.toLocaleString()} cutoffs!</h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    This server runs on late-night coding and chai. We sorted through 50,000+ MCC & AIIMS allotment records so you don't have to scan 3,000-page PDFs. Unlock full search access and complete college lists for an entire year.
                                </p>
                                <div class="pt-2">
                                    <button onclick="triggerRazorpayPayment()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-6 py-3 rounded-xl shadow-lg text-sm transition-transform active:scale-95 flex items-center justify-center gap-2 mx-auto cursor-pointer">
                                        <span>🔓 Unlock Everything for ₹10</span>
                                    </button>
                                </div>
                                <span class="text-[10px] text-slate-400 block">One-time payment • Valid for 1 Year</span>
                            </div>
                        </td>
                    </tr>
                `;
            }

            tableBody.innerHTML = rows;
            resultsCount.innerText = isPaywalled 
                ? `Showing preview (${freePreviewCount} of ${totalMatches.toLocaleString()} results) — Login & Unlock for full list` 
                : (totalMatches > displayLimit ? `Showing first ${displayLimit} of ${totalMatches.toLocaleString()} eligible cutoffs` : `Showing all ${totalMatches.toLocaleString()} eligible cutoffs`);
        }

        [rankInput, searchInput, examFilter, yearFilter, roundFilter, quotaFilter, categoryFilter].forEach(elem => {
            elem.addEventListener('input', filterAndRender);
            elem.addEventListener('change', filterAndRender);
        });

        resetBtn.addEventListener('click', () => {
            rankInput.value = '';
            searchInput.value = '';
            examFilter.value = '';
            yearFilter.value = '';
            roundFilter.value = '';
            quotaFilter.value = '';
            categoryFilter.value = '';
            selectedCourseValue = '';
            courseInput.value = '';
            filterAndRender();
        });
    </script>
